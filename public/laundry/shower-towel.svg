<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Large bath towel hanging -->
  <rect x="20" y="12" width="60" height="78" rx="3" fill="#D4EDFC" stroke="#4A9BD9" stroke-width="2.5"/>
  <!-- Towel bar -->
  <rect x="15" y="8" width="70" height="6" rx="3" fill="#B0B8C0" stroke="#8090A0" stroke-width="1.5"/>
  <!-- Towel texture stripes -->
  <line x1="20" y1="28" x2="80" y2="28" stroke="#A8D4F0" stroke-width="2"/>
  <line x1="20" y1="34" x2="80" y2="34" stroke="#A8D4F0" stroke-width="2"/>
  <line x1="20" y1="72" x2="80" y2="72" stroke="#A8D4F0" stroke-width="2"/>
  <line x1="20" y1="78" x2="80" y2="78" stroke="#A8D4F0" stroke-width="2"/>
</svg>
